[workspace]
resolver = "3"
members = ["app", "canon", "shared", "vcam", "vsr"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
shared = { path = "shared", version = "0.1.0" }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# The strictest set across Valorant-Overseer and afterimage, read by every
# crate through `[lints] workspace = true`. A lint that is wrong in one place
# gets `#[expect(lint, reason = "...")]` on that item, never `#[allow]`.

[workspace.lints.rust]
# Denied rather than forbidden, since forbid can't be lifted for one item and
# every crate here calls COM, Media Foundation, WPD or CUDA. Each item that
# needs `unsafe` says so with an `#[expect]`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
single_use_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stderr = "deny"
mem_forget = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
string_slice = "deny"
integer_division = "deny"
modulo_arithmetic = "deny"
as_underscore = "deny"
verbose_file_reads = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
suspicious_xor_used_as_pow = "deny"
try_err = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
partial_pub_fields = "deny"
str_to_string = "deny"
unnecessary_self_imports = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The relaxations both sibling repositories make, for the same reasons.
#
# `unreachable_pub` wants `pub(crate)` in a binary and this wants `pub` inside
# a private module, so the two can't both hold. `unreachable_pub` catches the
# real mistake.
redundant_pub_crate = "allow"
# Duplicate versions deep in eframe, wgpu and tray-icon, none of which this
# workspace can unify. `cargo deny` checks duplicates instead, naming each one it lets through.
multiple_crate_versions = "allow"
# Pixel, size and timing maths. A float to an integer has no other conversion
# than `as`, and `From` doesn't exist for most integer to float pairs.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
