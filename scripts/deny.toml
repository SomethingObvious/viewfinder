[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
private = { ignore = true }
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "ISC",
  "MIT",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
# Each arrives twice inside a framework. Pinned to the exact version so a new duplicate still fails.
skip = [
  # png 0.18 uses miniz_oxide 0.8 directly and 0.9 through flate2. It comes with egui's image.
  { crate = "miniz_oxide@0.8.9", reason = "png depends on both versions itself" },
  # The windows crate's own macros are still on syn 2, while egui's derives moved to syn 3.
  { crate = "syn@2.0.119", reason = "windows-implement and windows-interface are on syn 2" },
  # winit and glutin pin windows-sys 0.52, while eframe and tray-icon are on 0.61.
  { crate = "windows-sys@0.52.0", reason = "winit and glutin pin it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
