---
# Every rule on except these.
config:
  default: true

  # Prose reflows badly under a hard wrap, and every viewer soft-wraps.
  MD013: false

  # Table pipe padding is invisible once rendered.
  MD060: false

  MD046: {style: fenced}
  MD049: {style: asterisk}
  MD050: {style: asterisk}

globs:
  - "**/*.md"

ignores:
  - "**/target/**"
