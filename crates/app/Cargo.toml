[package]
name = "viewfinder"
description = "Turns a Canon EOS Rebel T3 or another camera into a Windows 11 webcam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "viewfinder"
path = "src/main.rs"

[dependencies]
canon = { path = "../canon", version = "1.0.0" }
capture = { path = "../capture", version = "1.0.0" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
fast_image_resize = "6.1.0"
raw-window-handle = "0.6.2"
shared.workspace = true
tray-icon = "0.26.1"
vsr = { path = "../vsr", version = "1.0.0" }
windows-core.workspace = true
windows = { workspace = true, features = [
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_FaceAnalysis",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zune-jpeg = "0.5.15"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
egui-wgpu = { version = "0.37.0", default-features = false }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
jpeg-encoder = "0.7.1"

[lints]
workspace = true
